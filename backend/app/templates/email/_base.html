<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ product_name }}</title></head>
<body style="margin:0;padding:0;background:#F4F6F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0E1A2B;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F8;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border:1px solid #E1E6ED;border-radius:14px;overflow:hidden;">
        <tr><td style="background:linear-gradient(155deg,#0E1A2B,#12283F 55%,#0B3A33);padding:22px 26px;">
          <span style="color:#FFFFFF;font-size:17px;font-weight:700;letter-spacing:-.025em;">{{ product_name }}</span>
        </td></tr>
        <tr><td style="padding:28px 26px;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 26px 24px;border-top:1px solid #EDF0F4;">
          <p style="margin:0;font-size:11.5px;line-height:1.6;color:#9AA8BB;">
            You are receiving this because you have a {{ product_name }} account.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
