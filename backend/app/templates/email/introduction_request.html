{% extends "_base.html" %}
{% block content %}
<h1 style="margin:0 0 10px;font-size:21px;font-weight:730;letter-spacing:-.028em;">Introduction request</h1>
<p style="margin:0 0 14px;font-size:14px;line-height:1.62;color:#33445F;">
  Hi {{ to_name }} — {{ from_name }}{% if from_company %} of {{ from_company }}{% endif %}
  has asked to be introduced{% if via %} via {{ via }}{% endif %}.
</p>
{% if message %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 18px;background:#FAFBFC;border:1px solid #E1E6ED;border-radius:10px;">
  <tr><td style="padding:14px 15px;">
    <p style="margin:0;font-size:13.5px;line-height:1.6;color:#33445F;">{{ message }}</p>
  </td></tr>
</table>
{% endif %}
<a href="{{ frontend_url }}/investors" style="display:inline-block;background:#0E7C6B;color:#FFFFFF;font-size:14px;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:6px;">
  Review request
</a>
{% endblock %}
